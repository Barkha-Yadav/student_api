spring.application.name=student_api

server.port = 9090

# telling the spring to connect to the student_db on my local machine
spring.datasource.url = jdbc:postgresql://localhost:5432/student_db
spring.datasource.username = postgres
spring.datasource.password = pf#(System.in);

# telling Hibernate (the ORM) to automatically update or create your table based on your java code
spring.jpa.hibernate.ddl-auto = update
spring.jpa.show-sql = true